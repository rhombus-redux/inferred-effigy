name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# On PRs and merge queue: cancel stale runs when new commits arrive.
# On push to main: never cancel — a publish mid-flight must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:

  # ── Verify ────────────────────────────────────────────────────────────────
  # Runs on all events except workflow_dispatch (which is promote-only).
  # Make this job a required status check on main in branch protection settings.
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Consumer-typecheck smoke: pack the tarball and `tsc --noEmit` a small
      # consumer under moduleResolution nodenext + bundler (skipLibCheck on and
      # off). Catches a non-self-contained published d.ts before auto-merge.
      - run: npm run check:consumer

  # ── Publish @next ─────────────────────────────────────────────────────────
  # Runs on every push to main. Uses semantic-release to determine the version
  # from conventional commits, publish to npm under the @next dist-tag, and
  # create a GitHub pre-release. Nothing is published on PRs or merge_group.
  publish-next:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # TODO: once a trusted publisher is configured on npmjs.com (package
    # Settings → Trusted Publisher; workflow ci.yml, repo
    # rhombus-redux/inferred-effigy, no environment), restore `id-token: write`
    # here, drop the NPM_TOKEN env below, and flip publishConfig.provenance
    # back to true in package.json to publish via OIDC with provenance.
    # Until then OIDC auto-detection would pre-empt token auth and fail, so we
    # authenticate with the NPM_TOKEN repo secret instead.
    permissions:
      contents: write        # create git tags and GitHub releases
      issues: write          # @semantic-release/github failure issues
      pull-requests: write   # @semantic-release/github success comments
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # semantic-release needs full history
      # No registry-url here, deliberately: setup-node would write an .npmrc
      # with `_authToken=${NODE_AUTH_TOKEN}` (unset in this job), which
      # @semantic-release/npm treats as existing auth and skips its own
      # NPM_TOKEN setup — `npm whoami` then goes out tokenless and 401s
      # (EINVALIDNPMTOKEN). Without registry-url, semantic-release writes its
      # own .npmrc from the NPM_TOKEN env below. (The promote job keeps
      # registry-url because it pairs it with NODE_AUTH_TOKEN, as setup-node
      # expects.)
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      # --no-install: semantic-release and its plugins are pinned in
      # devDependencies, so run the installed version (reproducible) rather than
      # letting npx float to latest.
      - run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Promote @next → @latest ───────────────────────────────────────────────
  # Triggered manually via "Run workflow" in the GitHub Actions UI.
  # Reads whatever version is currently on @next, promotes it to @latest on
  # npm, and marks the corresponding GitHub pre-release as the latest release.
  # No rebuild — the same artifact is just re-tagged.
  #
  # Setup: create a "production" environment in repo Settings → Environments
  # and configure required reviewers for an approval gate before promotion.
  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    # TODO: restore `id-token: write` and drop NPM_TOKEN once a trusted
    # publisher is configured on npmjs.com (see the publish-next TODO). Until
    # then `npm dist-tag add` authenticates with the NPM_TOKEN repo secret.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Resolve @next version
        id: resolve
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(npm view "$PACKAGE" dist-tags.next 2>/dev/null)
          if [ -z "$VERSION" ]; then
            echo "::error::No @next version found for $PACKAGE — nothing to promote."
            exit 1
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Promoting $PACKAGE@$VERSION (@next → @latest)"
      - name: Promote @next → @latest on npm
        run: npm dist-tag add ${{ steps.resolve.outputs.package }}@${{ steps.resolve.outputs.version }} latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Promote GitHub pre-release → latest release
        run: gh release edit ${{ steps.resolve.outputs.tag }} --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
